<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TECHNO INFODZ — لوحة التحكم الاحترافية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<!-- Firebase App & Database SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{
  --bg:#060b14;--panel:#0a1220;--card:#0e1829;--card2:#121f33;
  --a:#00e5ff;--a2:#0052d4;--a3:#5b00ff;--a4:#00c896;
  --red:#ff3d5a;--warn:#ff8800;--gold:#ffd700;
  --b:rgba(0,229,255,.09);--b2:rgba(0,229,255,.18);
  --t:#a8c8e8;--t2:#4a7090;--br:#dbeeff;
  --sh:0 0 40px rgba(0,229,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(rgba(0,229,255,.02) 1px,transparent 1px),
             linear-gradient(90deg,rgba(0,229,255,.02) 1px,transparent 1px);
  background-size:50px 50px}
::selection{background:var(--a);color:#000}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--a2);border-radius:3px}

/* ── SETUP SCREEN ── */
#setup-screen{
  position:fixed;inset:0;z-index:600;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.setup-box{
  background:var(--panel);border:1px solid var(--b2);border-radius:22px;
  padding:2.5rem;width:100%;max-width:460px;position:relative;overflow:hidden;
}
.setup-box::after{content:'';position:absolute;top:-100px;left:-100px;
  width:300px;height:300px;background:var(--a2);border-radius:50%;
  filter:blur(120px);opacity:.12;pointer-events:none;}
.setup-logo{font-family:'JetBrains Mono',monospace;font-size:1.15rem;
  color:var(--a);margin-bottom:.2rem;position:relative;}
.setup-logo em{color:var(--t2);font-style:normal;}
.setup-badge{display:inline-flex;align-items:center;gap:.4rem;
  font-size:.72rem;background:rgba(0,229,255,.08);border:1px solid var(--b2);
  padding:.25rem .7rem;border-radius:20px;color:var(--a);margin-bottom:1.75rem;}
.lbl{font-size:.8rem;color:var(--t2);margin-bottom:.4rem;display:block;}
.inp{width:100%;background:var(--card);border:1px solid var(--b);color:var(--br);
  padding:.72rem 1rem;border-radius:10px;font-family:'IBM Plex Sans Arabic',sans-serif;
  font-size:.88rem;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--a);}
.inp-group{margin-bottom:.9rem;}
.btn-connect{width:100%;margin-top:1.25rem;background:linear-gradient(135deg,var(--a2),var(--a3));
  color:#fff;border:none;padding:.85rem;border-radius:11px;font-size:.95rem;font-weight:600;
  cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;transition:opacity .2s,transform .2s;}
.btn-connect:hover{opacity:.9;transform:translateY(-1px);}
.setup-err{color:var(--red);font-size:.78rem;margin-top:.6rem;text-align:center;display:none;padding:.5rem;
  background:rgba(255,61,90,.06);border-radius:8px;}

/* ── APP ── */
#app{display:none;position:relative;z-index:1;}
.sidebar{position:fixed;top:0;right:0;bottom:0;width:230px;
  background:var(--panel);border-left:1px solid var(--b);
  padding:1.4rem .9rem;z-index:50;display:flex;flex-direction:column;gap:.3rem;}
.s-logo{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--a);
  padding:.5rem .7rem;margin-bottom:.5rem;}
.s-logo em{color:var(--t2);font-style:normal;}
.s-repo{font-size:.7rem;color:var(--t2);padding:0 .7rem .9rem;
  border-bottom:1px solid var(--b);margin-bottom:.5rem;
  font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-radius:9px;
  color:var(--t2);font-size:.855rem;cursor:pointer;border:none;background:none;
  width:100%;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif;transition:all .2s;}
.nav:hover{background:rgba(0,229,255,.06);color:var(--a);}
.nav.on{background:rgba(0,229,255,.1);color:var(--a);font-weight:600;}
.nav .ic{font-size:1rem;min-width:20px;text-align:center;}
.s-foot{margin-top:auto;}
.s-status{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;
  font-size:.72rem;color:var(--a4);margin-bottom:.6rem;}
.s-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--a4);
  animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-out{width:100%;padding:.6rem;border-radius:9px;background:rgba(255,61,90,.07);
  border:1px solid rgba(255,61,90,.18);color:var(--red);cursor:pointer;font-size:.82rem;
  font-family:'IBM Plex Sans Arabic',sans-serif;transition:background .2s;}
.btn-out:hover{background:rgba(255,61,90,.14);}

.main{margin-right:230px;padding:2rem;min-height:100vh;}
.page{display:none;animation:fadeIn .3s ease;}
.page.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ph{margin-bottom:1.75rem;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.ph-left h1{font-size:1.55rem;font-weight:700;color:var(--br);margin-bottom:.25rem;}
.ph-left p{color:var(--t2);font-size:.835rem;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.9rem;margin-bottom:1.75rem;}
.sc{background:var(--card);border:1px solid var(--b);border-radius:13px;padding:1.1rem;
  display:flex;align-items:center;gap:.85rem;transition:border-color .2s;}
.sc:hover{border-color:var(--b2);}
.sc-ic{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.sc-v{font-family:'JetBrains Mono',monospace;font-size:1.45rem;color:var(--a);font-weight:600;}
.sc-l{font-size:.73rem;color:var(--t2);margin-top:.1rem;}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:1.1rem;}
.pc{background:var(--card);border:1px solid var(--b);border-radius:15px;overflow:hidden;
  transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;}
.pc:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--b2);}
.pc-img{width:100%;height:155px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:3rem;border-bottom:1px solid var(--b);overflow:hidden;position:relative;}
.pc-img img{width:100%;height:100%;object-fit:cover;}
.pc-body{padding:1rem;}
.pc-name{font-weight:700;font-size:.975rem;color:var(--br);margin-bottom:.3rem;}
.pc-cat{display:inline-block;font-size:.65rem;font-family:'JetBrains Mono',monospace;
  padding:.18rem .5rem;border-radius:4px;margin-bottom:.55rem;}
.cat-برمجيات{background:rgba(0,82,212,.15);color:#5fa8ff;}
.pc-desc{font-size:.8rem;color:var(--t2);line-height:1.55;margin-bottom:.75rem;}
.pc-price{font-family:'JetBrains Mono',monospace;color:var(--a);font-size:1rem;font-weight:600;margin-bottom:.85rem;}
.pc-views{font-size:.78rem;color:var(--a);background:rgba(0,229,255,.06);padding:.3rem .6rem;border-radius:6px;margin-bottom:.75rem;display:inline-block;}

.fc{background:var(--card);border:1px solid var(--b);border-radius:15px;padding:1.65rem;max-width:640px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
.fgi{display:flex;flex-direction:column;gap:.38rem;}
.fgi.full{grid-column:1/-1;}
.fl{font-size:.79rem;color:var(--t2);}
.fi,.fs,.ft{background:var(--card2);border:1px solid var(--b);color:var(--br);
  padding:.68rem .9rem;border-radius:9px;font-family:'IBM Plex Sans Arabic',sans-serif;
  font-size:.855rem;outline:none;transition:border-color .2s;width:100%;}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--a);}
.ft{resize:vertical;min-height:80px;}

.bp{background:linear-gradient(135deg,var(--a2),var(--a3));color:#fff;border:none;
  padding:.72rem 1.6rem;border-radius:9px;font-size:.875rem;font-weight:600;cursor:pointer;
  font-family:'IBM Plex Sans Arabic',sans-serif;transition:opacity .2s,transform .2s;
  display:inline-flex;align-items:center;gap:.45rem;}
.bp:hover{opacity:.9;transform:translateY(-1px);}
.bg{background:transparent;border:1px solid var(--b2);color:var(--t);padding:.72rem 1.4rem;
  border-radius:9px;font-size:.875rem;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;}
.bg:hover{border-color:var(--a);color:var(--a);}

#toast{position:fixed;bottom:1.75rem;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--card);border:1px solid var(--a4);color:var(--a4);
  padding:.65rem 1.3rem;border-radius:9px;font-size:.83rem;z-index:500;
  opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;}
#toast.sh{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.er{border-color:var(--red);color:var(--red);}
#toast.ld{border-color:var(--warn);color:var(--warn);}

.tb{display:flex;align-items:center;gap:.65rem;margin-bottom:1.35rem;flex-wrap:wrap;}
.si{background:var(--card);border:1px solid var(--b);color:var(--br);
  padding:.58rem .9rem;border-radius:9px;font-family:inherit;font-size:.835rem;outline:none;flex:1;min-width:170px;}
.fb{padding:.5rem .9rem;border-radius:7px;border:1px solid var(--b);
  background:transparent;color:var(--t2);font-size:.78rem;cursor:pointer;font-family:inherit;}
.fb.on,.fb:hover{background:rgba(0,229,255,.09);color:var(--a);border-color:var(--b2);}

@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-right:0;padding:1rem;}
  .fg{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- SETUP / LOGIN -->
<div id="setup-screen">
  <div class="setup-box">
    <div class="setup-logo">TECHNO<em>INFODZ</em></div>
    <div class="setup-badge">⚡ GitHub API & Firebase — إدارة العروض والتحليلات</div>

    <div class="inp-group">
      <label class="lbl">GitHub Personal Access Token</label>
      <input class="inp" id="s-token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"/>
    </div>
    <div class="inp-group">
      <label class="lbl">مالك الـ Repository</label>
      <input class="inp" id="s-owner" placeholder="samirinfodz-boop" value="samirinfodz-boop"/>
    </div>
    <div class="inp-group">
      <label class="lbl">اسم الـ Repository</label>
      <input class="inp" id="s-repo" placeholder="technoinfodz-official" value="technoinfodz-official"/>
    </div>
    <div class="inp-group">
      <label class="lbl">اسم الفرع (Branch)</label>
      <input class="inp" id="s-branch" placeholder="main" value="main"/>
    </div>

    <button class="btn-connect" onclick="doConnect()">🔗 الاتصال بـ GitHub</button>
    <div id="s-err" class="setup-err"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <aside class="sidebar">
    <div class="s-logo">TECHNO<em>INFODZ</em></div>
    <div class="s-repo" id="repo-label">—</div>
    <button class="nav on" onclick="go('dashboard',this)"><span class="ic">📊</span>لوحة المعلومات</button>
    <button class="nav" onclick="go('products',this)"><span class="ic">📦</span>المنتجات (الكل)</button>
    <button class="nav" onclick="go('add',this)"><span class="ic">➕</span>إضافة منتج جديد</button>
    <div class="s-foot">
      <div class="s-status">متصل بالسيرفر</div>
      <button class="btn-out" onclick="disconnect()">🔌 قطع الاتصال</button>
    </div>
  </aside>

  <main class="main">
    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page on">
      <div class="ph">
        <div class="ph-left">
          <h1>مرحباً، لوحة إدارة المنتجات والتتبع 👋</h1>
          <p>إدخال وتحديث البرمجيات والمعدات وقراءة تحليلات الزوار</p>
        </div>
        <button class="bp" onclick="syncAll()">🔄 مزامنة الأن</button>
      </div>
      <div class="stats" id="dash-stats"></div>
    </div>

    <!-- PRODUCTS -->
    <div id="page-products" class="page">
      <div class="ph">
        <div class="ph-left"><h1>إدارة البرامج والعتاد</h1><p>تعديل وحذف العروض المتوفرة على الموقع</p></div>
        <button class="bp" onclick="go('add',null)">➕ إضافة عرض جديد</button>
      </div>
      <div class="tb">
        <input class="si" placeholder="🔍 بحث سريع في المنتجات..." oninput="filterP(this.value)"/>
        <button class="fb on" onclick="catF('الكل',this)">الكل</button>
        <button class="fb" onclick="catF('برمجيات',this)">⚙️ برمجيات (Software)</button>
      </div>
      <div class="pg" id="prod-grid"></div>
    </div>

    <!-- ADD PRODUCT -->
    <div id="page-add" class="page">
      <div class="ph"><div class="ph-left"><h1>➕ إضافة منتج (برنامج / عتاد)</h1></div></div>
      <div class="fc">
        <div class="fg">
          <div class="fgi full">
            <label class="fl">صورة المنتج</label>
            <div style="display:flex;gap:.5rem;">
              <input class="fi" id="add-img-url" placeholder="الصق رابط الصورة المباشر أو ارفع صورة..."/>
              <input type="file" id="add-img-file" accept="image/*" style="display:none" onchange="handleFileUpload(this, 'add-img-url')">
              <button class="bg" style="white-space:nowrap;font-size:.78rem;padding:.5rem .8rem;" onclick="document.getElementById('add-img-file').click()">📁 رفع صورة</button>
            </div>
          </div>
          <div class="fgi"><label class="fl">اسم المنتج *</label><input class="fi" id="add-name" placeholder="مثال: Hyper pro"/></div>
          <div class="fgi"><label class="fl">السعر الحالي *</label><input class="fi" id="add-price" value="تواصل معنا"/></div>
          <div class="fgi">
            <label class="fl">القسم الرئيسي *</label>
            <select class="fs" id="add-cat">
              <option value="برمجيات">برمجيات</option>
              <option value="عتاد إعلام آلي">عتاد إعلام آلي</option>
            </select>
          </div>
          <div class="fgi"><label class="fl">أيقونة تعبيرية (Emoji)</label><input class="fi" id="add-icon" value="📦" maxlength="4"/></div>
          <div class="fgi full"><label class="fl">التفاصيل الفنية</label><textarea class="ft" id="add-desc"></textarea></div>
        </div>
        <div style="display:flex;gap:.65rem;margin-top:1.35rem;">
          <button class="bp" id="add-btn" onclick="addProduct()">💾 نشر وتحديث الموقع الرسمي</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- EDIT MODAL -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:var(--card2);border:1px solid var(--b);border-radius:18px;padding:1.5rem;width:100%;max-width:560px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;">
      <h3 style="color:var(--a);margin:0;">✏️ تعديل المنتج</h3>
      <button onclick="closeEdit()" style="background:none;border:none;color:var(--t2);font-size:1.4rem;cursor:pointer;">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:.8rem;">
      <div><label class="fl">اسم المنتج</label><input class="fi" id="edit-name"/></div>
      <div><label class="fl">السعر</label><input class="fi" id="edit-price"/></div>
      <div><label class="fl">الوصف</label><textarea class="fi" id="edit-desc" rows="3"></textarea></div>
      <div>
        <label class="fl">رابط الصورة</label>
        <div style="display:flex;gap:.5rem;">
          <input class="fi" id="edit-img"/>
          <input type="file" id="edit-img-file" accept="image/*" style="display:none" onchange="handleFileUpload(this, 'edit-img')">
          <button class="bg" style="white-space:nowrap;font-size:.78rem;padding:.5rem .8rem;" onclick="document.getElementById('edit-img-file').click()">📁 رفع صورة</button>
        </div>
      </div>
      <div style="display:flex;gap:.7rem;margin-top:.5rem;">
        <button class="bp" onclick="saveEdit()" style="flex:1;">💾 حفظ التعديلات</button>
        <button class="bg" onclick="closeEdit()" style="flex:1;">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── التهيئة الأولية لـ Firebase ──
const firebaseConfig = {
  databaseURL: "https://technoinfodz-fb58d-default-rtdb.europe-west1.firebasedatabase.app"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

// ── دالة تسجيل زيادة المشاهدات للمنتج تلقائياً ──
function trackProductView(productId) {
  if (!productId) return;
  const viewsRef = firebase.database().ref('products/' + productId + '/views');
  viewsRef.transaction((currentViews) => {
    return (currentViews || 0) + 1;
  });
}

// ── دالة معالجة تحميل الصور من جهاز الكمبيوتر/الهاتف ──
function handleFileUpload(inputElement, targetInputId) {
  const file = inputElement.files[0];
  if (file) {
    if (file.size > 2 * 1024 * 1024) { // الحد 2 ميجابايت
      toast('⚠️ حجم الصورة كبير جداً، اختر صورة أقل من 2MB', 'er');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById(targetInputId).value = e.target.result;
      toast('✓ تم رفع وتحميل الصورة بنجاح');
    };
    reader.readAsDataURL(file);
  }
}

const SK = 'ti_cfg';
let CFG = null;
let products = [];
let catFilter = 'الكل';
let searchQ   = '';
let _tt;
const DATA_FILE = 'products.json';

function apiUrl(path){ return `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}`; }
function headers(){ return { Authorization:`token ${CFG.token}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' }; }

async function ghGet(path){
  const r = await fetch(apiUrl(path),{headers:headers()});
  if(!r.ok) throw new Error(`GitHub ${r.status}: ${r.statusText}`);
  return r.json();
}

async function ghPut(path, content_b64, sha, msg){
  const body = { message:msg, content:content_b64, branch:CFG.branch };
  if(sha) body.sha = sha;
  const r = await fetch(apiUrl(path),{method:'PUT',headers:headers(),body:JSON.stringify(body)});
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.statusText); }
  return r.json();
}

function toB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fromB64(b64){ return decodeURIComponent(escape(atob(b64))); }

async function doConnect(){
  const tokenInput = document.getElementById('s-token').value.trim();
  const owner      = document.getElementById('s-owner').value.trim();
  const repo       = document.getElementById('s-repo').value.trim();
  const branch     = document.getElementById('s-branch').value.trim()||'main';
  if(!tokenInput||!owner||!repo){ toast('جميع الحقول مطلوبة للاتصال','er'); return; }

  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`,{headers:{Authorization:`token ${tokenInput}`}});
    if(!r.ok) throw new Error('فشل المصادقة مع GitHub');
    CFG = { token: tokenInput, owner, repo, branch };
    localStorage.setItem(SK, JSON.stringify(CFG));
    launchApp();
  } catch(e){ toast('❌ ' + e.message, 'er'); }
}

function disconnect(){
  localStorage.removeItem(SK);
  CFG=null; products=[];
  document.getElementById('app').style.display='none';
  document.getElementById('setup-screen').style.display='flex';
}

(async function(){
  const saved = localStorage.getItem(SK);
  if(saved){ try { CFG = JSON.parse(saved); launchApp(); } catch(e){ localStorage.removeItem(SK); } }
})();

async function launchApp(){
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('repo-label').textContent = `${CFG.owner}/${CFG.repo}`;
  await syncAll();
}

async function syncAll(){
  toast('⏳ جاري سحب المنتجات...','ld');
  try {
    await loadProducts();
    await fetchLiveViews();
    renderDash(); 
    renderProducts();
    toast('✓ تمت المزامنة بنجاح');
  } catch(e){ toast('⚠️ خطأ بالمزامنة: '+e.message,'er'); }
}

async function loadProducts(){
  try {
    const f = await ghGet(DATA_FILE);
    const clean = f.content.replace(/\n/g, '');
    const d = JSON.parse(fromB64(clean));
    products = Array.isArray(d.products) ? d.products : (Array.isArray(d) ? d : []);
  } catch(e){ products = []; }
}

// جلب عداد المشاهدات الحي لكل منتج من Firebase Realtime Database
async function fetchLiveViews() {
  try {
    const snapshot = await firebase.database().ref('products').once('value');
    const data = snapshot.val() || {};
    products.forEach(p => {
      if (data[p.id] && data[p.id].views) {
        p.views = data[p.id].views;
      } else {
        p.views = 0;
      }
    });
  } catch(e) { console.error(e); }
}

async function saveProducts(commitMsg){
  let sha = null;
  try { const f = await ghGet(DATA_FILE); sha = f.sha; } catch(e){}
  const json = JSON.stringify({ products: products }, null, 2);
  await ghPut(DATA_FILE, toB64(json), sha, commitMsg);
}

async function addProduct(){
  const name  = document.getElementById('add-name').value.trim();
  const price = document.getElementById('add-price').value.trim();
  if(!name||!price){ toast('⚠️ حقول الاسم والسعر ضرورية','er'); return; }
  try {
    const imgUrl  = document.getElementById('add-img-url').value.trim();
    const p = {
      id: Date.now().toString(),
      name, price,
      cat:  document.getElementById('add-cat').value,
      icon: document.getElementById('add-icon').value||'📦',
      desc: document.getElementById('add-desc').value.trim(),
      img: imgUrl,
      views: 0
    };
    products.push(p);
    await saveProducts(`Add product: ${name}`);
    renderDash(); renderProducts();
    toast(`✓ تم إضافة "${name}" بنجاح`);
    go('products',null);
  } catch(e){ toast('❌ خطأ في الحفظ: '+e.message,'er'); }
}

function renderDash(){
  document.getElementById('dash-stats').innerHTML=`
    <div class="sc"><div class="sc-ic" style="background:rgba(0,229,255,.1);">📦</div><div><div class="sc-v">${products.length}</div><div class="sc-l">المجموع العام للسلع</div></div></div>
  `;
}

function renderProducts(){
  let list=products;
  if(catFilter!=='الكل') list=list.filter(p=>p.cat===catFilter);
  if(searchQ) list=list.filter(p=>p.name.toLowerCase().includes(searchQ.toLowerCase()));
  const g=document.getElementById('prod-grid');
  
  g.innerHTML=list.map(p=>`
    <div class="pc" onclick="trackProductView('${p.id}')">
      <div class="pc-img">
        ${p.img ? `<img src="${p.img}" alt="${p.name}">` : `<span>${p.icon||'📦'}</span>`}
      </div>
      <div class="pc-body">
        <span class="pc-cat cat-${p.cat}">${p.cat}</span>
        <div class="pc-name">${p.name}</div>
        <!-- حقل عداد المشاهدات داخل الكارت -->
        <div class="pc-views">👁️ عدد المشاهدات: <span id="views-${p.id}">${p.views || 0}</span></div>
        <div class="pc-desc">${p.desc||''}</div>
        <div class="pc-price">${p.price}</div>
        <div style="display:flex;gap:.5rem;margin-top:.7rem;">
          <button onclick="event.stopPropagation(); openEdit('${p.id}')" style="flex:1;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--a);border-radius:8px;padding:.4rem .7rem;cursor:pointer;font-size:.78rem;">✏️ تعديل</button>
          <button onclick="event.stopPropagation(); deleteProduct('${p.id}')" style="flex:1;background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.3);color:#ff5050;border-radius:8px;padding:.4rem .7rem;cursor:pointer;font-size:.78rem;">🗑️ حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

let editingId = null;
function openEdit(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('edit-name').value  = p.name  || '';
  document.getElementById('edit-price').value = p.price || '';
  document.getElementById('edit-desc').value  = p.desc  || '';
  document.getElementById('edit-img').value   = p.img   || '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeEdit() {
  document.getElementById('edit-modal').style.display = 'none';
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const idx = products.findIndex(x => x.id === editingId);
  if (idx === -1) return;
  products[idx] = {
    ...products[idx],
    name:  document.getElementById('edit-name').value.trim(),
    price: document.getElementById('edit-price').value.trim(),
    desc:  document.getElementById('edit-desc').value.trim(),
    img:   document.getElementById('edit-img').value.trim(),
  };
  try {
    await saveProducts(`Edit product: ${products[idx].name}`);
    renderDash(); renderProducts();
    toast(`✓ تم التعديل بنجاح`);
    closeEdit();
  } catch(e) { toast('❌ خطأ في الحفظ: ' + e.message, 'er'); }
}

async function deleteProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p || !confirm(`هل تريد حذف "${p.name}"؟`)) return;
  products = products.filter(x => x.id !== id);
  try {
    await saveProducts(`Delete product: ${p.name}`);
    renderDash(); renderProducts();
    toast(`✓ تم الحذف`);
  } catch(e) { toast('❌ خطأ بالحذف: ' + e.message, 'er'); }
}

function filterP(q){ searchQ=q; renderProducts(); }
function catF(c,btn){ catFilter=c; document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); renderProducts(); }
function go(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('page-'+id).classList.add('on');
  if(btn){ document.querySelectorAll('.nav').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
}
function toast(msg,type='ok'){ const el=document.getElementById('toast'); el.textContent=msg; el.className='sh'+(type==='er'?' er':type==='ld'?' ld':''); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('sh'),3200); }
</script>
