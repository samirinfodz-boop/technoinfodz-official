<meta property="og:description" content="طابعة Canon Photo Selphy CP‑1000 باللون الأسود تجمع بين التصميم الأنيق والسهولة المطلقة في الاستخدام، لتطبع صورًا عالية الجودة بحجم 10 × 15 سم في ثوانٍ معدودة دون الحاجة إلى حبر سائل. تدعم الاتصال اللاسلكي Wi‑Fi وبلوتوث، ما يتيح للطباعة مباشرة من الهواتف الذكية أو الأجهزة اللوحية عبر تطبيق Canon SELPHY. بفضل بطاريتها القابلة لإعادة الشحن، يمكن للمحلات التجارية والوكالات الإعلانية تقديم بطاقات تعريف، كوبونات، أو عينات منتجات فورية للزبائن في أي مكان. مع حجمها المدمج وسهولة صيانتها، تصبح Selphy CP‑1000 الأداة المثالية لتسريع عمليات الطباعة داخل المتجر وتعزيز تجربة العملاء.">
